[project]
name = "ani-watch"
version = "0.1.0"
description = "A modular terminal-based anime discovery, tracking, and playback client."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "vishwas0229" }]
dependencies = [
  "httpx>=0.28,<1.0",
  "pydantic>=2.10,<3.0",
  "platformdirs>=4.3,<5.0",
  "rich>=13.9,<15.0",
  "sqlalchemy>=2.0,<3.0",
  "typer>=0.15,<1.0",
  "tomli-w>=1.1,<2.0",
  "textual>=1.0,<8.0",
  "alembic>=1.16,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "python-vlc>=3.0,<4.0",
  "redis>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<1.0",
  "ruff>=0.11,<1.0",
  "pytest-httpx>=0.35,<1.0",
]

[project.scripts]
ani-watch = "ani_watch.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ani_watch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
