name: One-time branch formatting

on:
  push:
    branches:
      - feat/telegram-personal-media

permissions:
  contents: write

jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[skip-telegram-format]')"
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install ruff==0.14.14

      - name: Format repository
        run: python -m ruff format .

      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            echo "Repository is already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: format Telegram integration [skip-telegram-format]"
          git push
