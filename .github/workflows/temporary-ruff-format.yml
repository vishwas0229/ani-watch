name: Temporary Ruff formatter

on:
  push:
    branches: [fix/ci-ruff-import-order]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7.0.1
        with:
          ref: fix/ci-ruff-import-order

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned Ruff
        run: python -m pip install ruff==0.14.14

      - name: Format repository
        run: python -m ruff format .

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Repository already formatted."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: format repository with Ruff 0.14.14 [skip ci]"
          git push origin HEAD:fix/ci-ruff-import-order
