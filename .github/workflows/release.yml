name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  quality:
    name: Release quality / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: ani-watch-release-ci
          python-version: ${{ matrix.python-version }}
          channels: conda-forge
          channel-priority: strict
          auto-activate-base: false

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Run Ruff checks
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

  build:
    name: Build distributions
    needs: quality
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: ani-watch-release-build
          python-version: "3.12"
          channels: conda-forge
          channel-priority: strict
          auto-activate-base: false

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build twine

      - name: Verify release version
        if: github.ref_type == 'tag'
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          runtime_version="$(python -c 'import ani_watch; print(ani_watch.__version__)')"
          package_version="$(python -c 'from importlib.metadata import version; print(version("ani-watch"))')"
          changelog_version="$(sed -n 's/^## \\([^ ]*\\).*/\\1/p' CHANGELOG.md | head -n 1)"
          test "$tag_version" = "$runtime_version"
          test "$runtime_version" = "$package_version"
          test "$package_version" = "$changelog_version"

      - name: Build wheel and source distribution
        run: python -m build --wheel --sdist

      - name: Verify distribution files
        run: |
          test -n "$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: ani-watch-distributions
          path: dist/*
          if-no-files-found: error

  smoke:
    name: Smoke-test release artifacts
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: ani-watch-distributions
          path: dist

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: ani-watch-smoke
          python-version: "3.12"
          channels: conda-forge
          channel-priority: strict
          auto-activate-base: false

      - name: Install wheel in a clean environment
        shell: bash -el {0}
        run: |
          python -m pip install dist/*.whl
          python -c 'import ani_watch; from importlib.metadata import version; assert ani_watch.__version__ == version("ani-watch")'

      - name: Install source distribution in a clean environment
        shell: bash -el {0}
        run: |
          conda create -n ani-watch-smoke-sdist python=3.12 pip -y
          conda run -n ani-watch-smoke-sdist python -m pip install dist/*.tar.gz
          conda run -n ani-watch-smoke-sdist python -c 'import ani_watch; from importlib.metadata import version; assert ani_watch.__version__ == version("ani-watch")'

  publish:
    name: Publish GitHub release
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: ani-watch-distributions
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
