name: Temporary playback formatter

on:
  push:
    branches:
      - feat/playback-lifecycle

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: ani-watch-format
          python-version: "3.12"
          channels: conda-forge
          channel-priority: strict
          auto-activate-base: false

      - name: Install project dependencies
        shell: bash -el {0}
        run: python -m pip install -e ".[dev]"

      - name: Format repository
        shell: bash -el {0}
        run: python -m ruff format .

      - name: Commit formatted files
        shell: bash -el {0}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git commit -m "style: format playback lifecycle changes"
          git push
